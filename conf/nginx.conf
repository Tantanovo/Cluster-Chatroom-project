# Nginx TCP 四层负载均衡配置（集群聊天室专用）
# 用法：nginx -c <项目目录>/conf/nginx.conf
# 说明：本项目是自定义 TCP 私有协议（4字节长度头+JSON），不是 HTTP，
#       因此必须用 stream 模块做四层转发，不能使用 http 块。

worker_processes  1;

events {
    worker_connections  1024;
}

stream {
    # 业务服务器节点池：least_conn 选当前活跃连接数最少的节点
    upstream chatserver {
        least_conn;
        server 127.0.0.1:6000 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:6002 weight=1 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;               # 客户端统一连这个端口
        proxy_pass chatserver;

        # 聊天是长连接（服务端要主动推送消息），超时调大
        proxy_timeout 300s;
        proxy_connect_timeout 5s;
    }
}
